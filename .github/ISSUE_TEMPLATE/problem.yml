name: Report a problem
description: Something doesn't work as expected. Tell us what happened and we'll help.
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Many problems are answered in the [Troubleshooting](https://thankost.github.io/pedal-cues/guide.html#12-troubleshooting) section of the guide, so have a quick look there first.
        Opening this form from the app (**☰ > Report a problem**, or **Help > Report a Problem**) fills in your version and system for you.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I dragged the Scene B tile onto the QC Cues track and pressed play, but the QC stayed on scene A."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      description: Optional, but it helps a lot.
      placeholder: |
        1. Open PedalCues in my DAW
        2. ...
  - type: input
    id: version
    attributes:
      label: PedalCues version
      description: Shown under the title in the app (for example 0.4.19).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Computer
      description: Operating system and version.
      placeholder: "macOS 15.5 / Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: How do you run PedalCues?
      options:
        - VST3 plugin
        - AU plugin (macOS)
        - LV2 plugin (Linux)
        - Standalone app
    validations:
      required: true
  - type: input
    id: daw
    attributes:
      label: DAW
      description: Name and version, if you use a DAW.
      placeholder: "Reaper 7.2 / Ableton Live 12 / none"
  - type: dropdown
    id: setup
    attributes:
      label: Wiring
      description: How your pedals are connected (see the Wiring guide in the app).
      options:
        - One device (USB or one MIDI Out)
        - Daisy chain (interface MIDI Out > first device > Thru > second device)
        - Separate outputs (one MIDI Out or USB per device)
        - Only the Whammy
        - Something else (describe above)
  - type: dropdown
    id: amp
    attributes:
      label: Amp modeller or MIDI device
      description: Which unit you use with PedalCues, if any.
      options:
        - Quad Cortex
        - QC Mini
        - Kemper Profiler (Head, Rack, Stage, ...)
        - Kemper Player
        - Line 6 (Helix, HX Stomp, HX Effects, POD Go, Stadium), name the model above
        - Fractal Audio (Axe-Fx, FM9, FM3, AX8, FX8, VP4), name the model above
        - HeadRush (Core, Prime, Flex Prime, Pedalboard, Gigboard, MX5), name the model above
        - Boss GT-1000 / GT-1000CORE (template)
        - Darkglass (Anagram, Microtubes Infinity), name the model above
        - Neural DSP Nano Cortex
        - Custom MIDI device (beta), name it above
        - None
  - type: dropdown
    id: whammy
    attributes:
      label: Effects & Pedals tab
      description: The device on the Effects & Pedals tab (the Whammy V unless you picked another).
      options:
        - Whammy V
        - Whammy DT
        - Line 6 DL4 MkII (beta)
        - Line 6 HX One (beta)
        - Strymon (beta), name the model above
        - Boss DD-500 / RV-500 / MD-500 (beta)
        - Meris (beta), name the model above
        - Chase Bliss (beta), name the model above
        - Walrus Audio, Source Audio or EHX (beta), name the model above
        - A template (VP4, Microtubes Infinity, Eventide H9 / H90, Boss RC-500 / RC-600), name it above
        - Custom MIDI device (beta), name it above
        - I don't use this tab
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a short video or your exported setup (☰ > Export setup) are very welcome. Drag files here.
