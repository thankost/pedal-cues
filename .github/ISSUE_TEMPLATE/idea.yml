name: Suggest an idea
description: A feature, a pedal you'd like supported, a custom MIDI device file to share, or something that could be easier.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like PedalCues to do? Sharing a custom MIDI device? Attach its .pedalcues-device file (zip it if GitHub refuses it) and say which gear it's for.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it?
      description: A song, a live show, a rehearsal... the real situation helps a lot.
  - type: input
    id: version
    attributes:
      label: PedalCues version (optional)
