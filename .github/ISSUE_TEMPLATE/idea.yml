name: Suggest an idea
description: A feature, a pedal you'd like supported, or something that could be easier.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like PedalCues to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it?
      description: A song, a live show, a rehearsal... the real situation helps a lot.
  - type: input
    id: version
    attributes:
      label: PedalCues version (optional)
