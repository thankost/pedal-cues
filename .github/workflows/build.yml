name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04        # older glibc, so the Linux build runs on more distros
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libudev-dev ninja-build

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.8 https://github.com/juce-framework/JUCE.git external/JUCE

      - name: Configure
        run: |
          extra=""
          [ "${{ runner.os }}" = "macOS" ] && extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPEDALCUES_COPY_PLUGIN=OFF $extra

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: |
          exe=build/PedalCuesTests_artefacts/Release/PedalCuesTests
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe"

      - name: Package
        run: |
          out="PedalCues-${{ matrix.name }}"
          art=build/PedalCues_artefacts/Release
          mkdir -p "$out"
          cp -R "$art/VST3/PedalCues.vst3" "$out/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "$art/AU/PedalCues.component" "$out/"
            cp -R "$art/Standalone/PedalCues.app" "$out/"
            # Re-seal each bundle with an ad-hoc signature; a broken seal makes macOS report the app as "damaged".
            for b in "$out"/PedalCues.app "$out"/PedalCues.vst3 "$out"/PedalCues.component; do
              xattr -cr "$b"
              codesign --force --deep --sign - --timestamp=none "$b"
              codesign --verify --deep --strict --verbose=2 "$b"
            done
            lipo -archs "$out/PedalCues.app/Contents/MacOS/PedalCues"
            ditto -c -k --keepParent "$out" "$out.zip"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp -R "$art/LV2/PedalCues.lv2" "$out/"
            cp "$art/Standalone/PedalCues" "$out/"
            chmod +x "$out/PedalCues"
            zip -r -q "$out.zip" "$out"
          else
            cp "$art/Standalone/PedalCues.exe" "$out/"
            7z a "$out.zip" "$out" > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PedalCues-${{ matrix.name }}
          path: PedalCues-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release notes = the tagged commit's message. Only the highest version is marked "Latest",
      # so releases that finish building out of order never make an older one Latest.
      - name: Release notes and latest flag
        id: meta
        run: |
          git log -1 --format=%B "$GITHUB_REF_NAME" > notes.md
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "latest=$([ "$newest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          body_path: notes.md
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.latest }}
